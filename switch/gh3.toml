# gh3-nx settings. This file sits next to gh3-nx.nro (the runtime reads <app>.toml beside the
# executable). The game itself goes in game/, next to this file, from your own disc.
#
# Starting point, not yet tested on a Switch: the GPU values are the ones project8-sw shipped for
# the same engine (Neversoft) on an OLED Switch in handheld mode. Change one at a time.

# Draw with the port's own Vulkan renderer. "xenos" uses the SDK's emulated Xbox 360 GPU instead:
# correct but far too slow to play (1-5 fps).
gh3_renderer = "native"

# One sample per pixel; true renders the game's multisampled targets with their samples.
gh3_native_msaa = false
# O palco (superfície 4x de pitch P) com 1 amostra por pixel de guest, subindo por blit para o alvo 1x de
# pitch 2P que o jogo lê; true desenha as amostras como pixels (4x os pixels, ~31-36 ms de GPU/quadro).
gh3_native_msaa_as_samples = false
# Upper bound on anisotropic texture filtering (1-16).
gh3_native_max_anisotropy = 2
# Depth in 32 bits per pixel instead of 64.
gh3_native_depth24 = true
# Make the draws' Vulkan calls on a second thread.
gh3_native_record_thread = true
# Log GPU time by render pass. For measuring only.
gh3_native_gpu_profile = false

# Cede o núcleo quando um thread do jogo gira no contador de quadro (src/guest_waits.h). Ligado por
# padrão no Switch, onde o processo só tem 3 núcleos; false volta ao comportamento antigo para comparar.
gh3_guest_waits = true
# ZCULL (pixels escondidos pulados pela GPU). Exige o patch local do Mesa (patches/mesa-switch/
# 0005-...) e loadOp=CLEAR no depth; medir no Switch antes de ligar por padrão.
gh3_native_zcull = false
# Pula a espera de vblank de um frame atrasado. Medido no Switch: sem ganho (os frames lentos do GH3
# são 50-78 ms arbitrários, trabalho do próprio jogo, não múltiplos do tick de 16,7 ms). Fica desligado.
gh3_vblank_late_no_wait = false
# Modo desempenho: pula os passes do mapa de sombra e do bloom (src/native/native_renderer.cpp).
# Medido no Switch (2026-10-18, clocks de fábrica): FPS mediano 34 -> 45, quadros >50 ms por 10 s
# 46-108 -> 8; o jogo é limitado pela GPU. Sem o bloom some também o esbranquiçado da cena (o brilho
# excessivo do T9 era o bloom). false volta os dois efeitos.
gh3_native_skip_shadows = true
gh3_native_skip_bloom = true
# Cena 3D abaixo da resolução da HUD (o passe principal com profundidade é o maior custo de GPU no
# Switch; src/native/native_scene_scale.h). 1.0 desliga.
gh3_native_scene_scale = 0.65
# Controlador dinâmico 0.65-1.0 em passos de 0.05 para caber em 16.7 ms (histerese de 3 quadros e 0.6 s
# no mesmo nível; src/native/native_scene_dynamic.h). A escala acima é só o ponto de partida.
gh3_native_scene_dynamic = true
# CAS (FidelityFX) no blit que sobe a cena escalada para 1280x720, no lugar do LINEAR (T32): compensa o
# borrão de renderizar a 0.65. Só atua com o alvo de cor R8G8B8A8_UNORM; o resto continua LINEAR.
gh3_native_scene_cas = true
gh3_native_scene_cas_sharpness = 0.2
# Loga a contagem de cedências a cada 4096. Diagnóstico.
gh3_guest_waits_stats = false

# No portátil, pede o modo de GPU oficial de 460,8 MHz (apm 0x92220008) e volta ao padrão ao sair
# (src/switch_apm.h).
gh3_switch_gpu_boost = true

# The log goes to logs/ next to the NRO.
log_level = "info"
